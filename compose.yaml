services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Configurar DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configurar DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:?Configurar DB_DATABASE}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
